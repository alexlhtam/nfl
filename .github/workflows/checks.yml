name: Verify coaching tool

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run numerical, data, and application checks
        run: python -m unittest discover -s tests -v
      - name: Export the offline coaching tool
        run: python app.py --export submission/open-field.html
      - uses: actions/upload-artifact@v4
        with:
          name: open-field-offline-demo
          path: submission/open-field.html
